<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copérnico Bug Runner - IPET 249 Informática</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-container">
    <header class="top-bar">
      <div class="school-brand">
        <img src="assets/escudo-ipet249.png" alt="Escudo IPET 249" class="header-logo" />
        <div>
          <span class="badge">6° G · INFORMÁTICA</span>
          <h1>IPET N° 249 "NICOLÁS COPÉRNICO"</h1>
        </div>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>

    <p class="controls-hint">
      Controles: <strong>ESPACIO</strong>, <strong>W / FLECHA ARRIBA</strong> o <strong>CLIC / TOQUE</strong> para impulsar
    </p>
  </main>

  <script src="game.js"></script>
</body>
</html>
